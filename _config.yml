# Site settings
title:          Harin
description:    "My little place in the internet"
baseurl:        ""
url:            "https://harin.in"

# Google Analytics
google_analytics: UA—XXXXXXXX-X

# Author
author:
  name:         Harin
  url:          https://harin.in
  email:        iamharinramesh@gmail.com

# Build settings
markdown:       kramdown
include:
  - _pages

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  # - jemoji #Uncomment this to allow emoji in your post

# Permalinks
permalink:      /:year-:month-:day/:title
paginate:       5

# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec, vendor, .bundle, .jekyll-cache, .sass-cache ]

# Disqus (Set to your disqus id)
disqus:         jekyll-tale