---
layout: default
---

<article class="post{% if page.hide_title %} post--no-header{% endif %}">
  {% unless page.hide_title %}
  <header class="post-header">
    <time datetime="{{ page.date }}" class="post-date">{{ page.date | date: "%b %d, %Y" }}</time>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>
  {% endunless %}

  <div class="post-content">
    {{ content }}
  </div>
</article>

{% if page.comments %}
  {% include disqus_comments.html %}
{% endif %}

<div class="pagination">
  {% if page.next.url %}
    <a href="{{ page.next.url | prepend: site.baseurl }}" class="left arrow">&#8592;</a>
  {% endif %}
  {% if page.previous.url %}
    <a href="{{ page.previous.url | prepend: site.baseurl }}" class="right arrow">&#8594;</a>
  {% endif %}

  <a href="#" class="top">Top</a>
</div>
